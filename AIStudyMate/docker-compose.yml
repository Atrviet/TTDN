services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_studymate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_studymate}
      POSTGRES_USER: ${POSTGRES_USER:-ai_studymate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_studymate_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

